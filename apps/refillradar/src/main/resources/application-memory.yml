# The `memory` profile: run RefillRadar with no database at all.
#
#     java -jar target/refillradar-0.1.0-SNAPSHOT.jar --spring.profiles.active=memory
#
# DATA IS LOST ON RESTART, including the alert ledger - so a restarted instance will
# re-send every alert it has ever sent. This exists for a five-minute demo and for the
# unit tests, and is deliberately opt-in: you cannot reach it by misconfiguration.
#
# Excluding the auto-configuration (rather than just swapping the repository beans) means
# the application never opens a connection pool, never runs a migration, and starts with
# no database present at all.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.transaction.jta.JtaAutoConfiguration

# CI for RefillRadar.
#
# The whole suite runs with NO network and NO database: shortage data comes from a
# recorded fixture on the classpath. That is deliberate - a build that depends on a
# third-party API goes red when someone else's server has a bad day, and a CI signal
# nobody trusts is worse than no CI at all.
name: RefillRadar CI

on:
  push:
    paths:
      - 'apps/refillradar/**'
      - '.github/workflows/refillradar-ci.yml'
  pull_request:
    paths:
      - 'apps/refillradar/**'
      - '.github/workflows/refillradar-ci.yml'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/refillradar

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2 keyed on pom.xml, turning a ~2 minute dependency
          # download into a few seconds on every run after the first.
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B verify

      - name: Upload test reports
        # always() so reports are published even when tests FAIL - which is
        # precisely when you need to read them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/refillradar/target/surefire-reports/
          retention-days: 7

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build          # never build an image from code that failed its tests
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t refillradar:${{ github.sha }} \
            -t refillradar:latest \
            apps/refillradar

      # Deployment is intentionally NOT wired up yet. When it is, push to a
      # registry tagged with ${{ github.sha }} - never "latest" alone, because
      # you cannot roll back to "latest".
      - name: Smoke test the image
        run: |
          docker run -d --name refillradar -p 8080:8080 refillradar:${{ github.sha }}
          curl --retry 30 --retry-delay 2 --retry-connrefused -sS \
            localhost:8080/api/users/ci-smoke-test/supply-check | tee /dev/stderr | grep -q '"shortagesScanned":8'
          docker rm -f refillradar

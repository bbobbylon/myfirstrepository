# CI for SafeWord.
#
# No third-party network calls. It DOES need a database as of v0.2: the persistence tests
# assert things a HashMap passes trivially and PostgreSQL might not - a date surviving a
# round trip, an enum stored by name, a CHECK constraint actually firing.
#
# The container job is NOT branch-gated, so the image is verified before a merge rather
# than after it - see apps/refillradar/README.md for the incident that established that.
name: SafeWord CI

on:
  push:
    paths:
      - 'apps/safeword/**'
      - '.github/workflows/safeword-ci.yml'
  pull_request:
    paths:
      - 'apps/safeword/**'
      - '.github/workflows/safeword-ci.yml'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/safeword

    # Matches the defaults in application.yml, so no test needs overriding config.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: safeword
          POSTGRES_USER: safeword
          POSTGRES_PASSWORD: safeword
        ports:
          - 5432:5432
        # Without this the build can start before the database accepts connections.
        options: >-
          --health-cmd "pg_isready -U safeword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeword-surefire-reports
          path: apps/safeword/target/surefire-reports/
          retention-days: 7

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build          # never build an image from code that failed its tests

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t safeword:${{ github.sha }} apps/safeword

      # A user-defined network rather than the job's `services:` block, because this
      # container is started with `docker run` and so is not on the job's service network.
      - name: Start a database for the smoke test
        run: |
          docker network create safeword-net
          docker run -d --name safeword-db --network safeword-net \
            -e POSTGRES_DB=safeword \
            -e POSTGRES_USER=safeword \
            -e POSTGRES_PASSWORD=safeword \
            postgres:16

          echo "Waiting for PostgreSQL to accept connections..."
          for i in $(seq 1 60); do
            if docker exec safeword-db pg_isready -U safeword >/dev/null 2>&1; then
              echo "PostgreSQL ready after ~${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::PostgreSQL did not become ready within 60s"
              docker logs safeword-db
              exit 1
            fi
            sleep 1
          done

      - name: Smoke test the image
        run: |
          docker run -d --name safeword -p 8083:8083 \
            --network safeword-net \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://safeword-db:5432/safeword \
            -e SPRING_DATASOURCE_USERNAME=safeword \
            -e SPRING_DATASOURCE_PASSWORD=safeword \
            safeword:${{ github.sha }}

          # Wait for the JVM to bind before curling. Do NOT rely on
          # --retry-connrefused alone: it does not cover curl error 56 (connection
          # reset), which is what Docker's proxy returns while the container is up but
          # the app has not yet bound its port.
          echo "Waiting for application startup..."
          for i in $(seq 1 60); do
            if docker logs safeword 2>&1 | grep -q "Started SafeWordApplication"; then
              echo "Application started after ~${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Application did not start within 60s"
              docker logs safeword
              docker rm -f safeword safeword-db
              exit 1
            fi
            sleep 1
          done

          fail() {
            echo "::error::$1"
            docker logs safeword
            docker rm -f safeword safeword-db
            exit 1
          }

          # ---- 1. A stranger must not reach anybody's circle -------------------------
          # v0.1 trusted a circle id from the URL. The escalate one is the dangerous half:
          # once delivery is wired, being able to do this anonymously means being able to
          # cry wolf at someone else's family until they ignore the real alert.
          echo "--- anonymous circle routes (expect 401) ---"
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                        --retry 10 --retry-delay 2 --retry-all-errors --retry-connrefused \
                        localhost:8083/api/me/circle/status)
          [ "$STATUS" = "401" ] || fail "Anonymous circle read returned $STATUS, expected 401"

          ESCALATE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                          -X POST localhost:8083/api/me/circle/escalate \
                          -H 'Content-Type: application/json' -d '{"aboutMoney":true}')
          [ "$ESCALATE" = "401" ] || fail "Anonymous escalation returned $ESCALATE, expected 401"
          echo "OK: a stranger can neither read a circle nor raise an alarm to one"

          # ---- 2. ...and the emergency routes must STILL be open ---------------------
          # The opposite failure, and a quieter one: nothing looks broken, the app is just
          # useless at the moment it exists for. /api/check-call is a POST with no session
          # and no CSRF token on purpose - it reads and writes nothing.
          echo "--- public routes during a call (expect 200 with no credentials) ---"
          for route in /api/pause /api/scam-patterns /api/passphrase/instructions; do
            CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                        "localhost:8083$route")
            [ "$CODE" = "200" ] || fail "Public route $route returned $CODE, expected 200. Someone being pressured on the phone must not meet a login wall."
          done
          CHECK=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                       -X POST localhost:8083/api/check-call \
                       -H 'Content-Type: application/json' -d '{"signals":["URGENCY"]}')
          [ "$CHECK" = "200" ] || fail "Anonymous /api/check-call returned $CHECK, expected 200"
          echo "OK: the pause screen, call check and pattern library stay open to anyone"

          # ---- 3. Anonymous traffic must not create sessions ------------------------
          # Same bug class RefillRadar hit: Spring Security's default RequestCache stashes
          # each rejected request in a NEW session, which is an unauthenticated way to grow
          # the database.
          for i in $(seq 1 10); do
            curl --silent --output /dev/null localhost:8083/api/me/circle/status
          done
          SESSIONS=$(docker exec safeword-db psql -U safeword -d safeword -tAc \
            "SELECT count(*) FROM SPRING_SESSION")
          [ "$SESSIONS" = "0" ] || fail "10 anonymous requests created $SESSIONS session rows, expected 0"
          echo "OK: 10 anonymous requests created 0 sessions"

          # ---- 4. Register, log in, and take the CSRF token -------------------------
          curl --fail --silent --show-error -c jar.txt -X POST localhost:8083/api/auth/register \
               -H 'Content-Type: application/json' \
               -d '{"username":"ci-smoke-test","password":"a-long-enough-ci-passphrase"}' \
               -o register.json || fail "Registration failed"

          curl --fail --silent --show-error -c jar.txt -b jar.txt -X POST localhost:8083/api/auth/login \
               -H 'Content-Type: application/json' \
               -d '{"username":"ci-smoke-test","password":"a-long-enough-ci-passphrase"}' \
               -o login.json || fail "Login failed"

          XSRF=$(grep XSRF-TOKEN jar.txt | awk '{print $7}')
          [ -n "$XSRF" ] || fail "No XSRF-TOKEN cookie was issued, so no write can be made"

          # ---- 5. THE security invariant: a supplied passphrase is refused ----------
          # No --fail here: the expected answer is 400, which --fail would treat as a
          # transport error and send this down the wrong branch.
          echo "--- POST a circle WITH a passphrase: must be refused ---"
          curl --silent --show-error -b jar.txt -X POST localhost:8083/api/me/circle \
               -H 'Content-Type: application/json' -H "X-XSRF-TOKEN: $XSRF" \
               -d '{"name":"ci-smoke-test","passphrase":"bluebird","members":[]}' \
               -o response.json || fail "Endpoint did not respond"

          cat response.json; echo

          # Asserted by a script rather than inline, so it can be run locally - and so a bad
          # edit cannot silently leave the wrong endpoint in place, which is exactly how an
          # earlier version of this step shipped broken.
          python3 apps/safeword/ci/assert_passphrase_refused.py response.json || fail "The server accepted a passphrase"

          # ---- 6. A real circle round-trips through PostgreSQL ---------------------
          CREATED=$(curl --silent --output created.json --write-out '%{http_code}' \
                         -b jar.txt -X POST localhost:8083/api/me/circle \
                         -H 'Content-Type: application/json' -H "X-XSRF-TOKEN: $XSRF" \
                         -d '{"name":"ci-smoke-test","passphraseAgreedOn":"2026-09-01","members":[{"name":"Ana","role":"RESPONDER","contact":"+15551112222"}]}')
          [ "$CREATED" = "201" ] || fail "Creating a circle returned $CREATED, expected 201"

          curl --fail --silent --show-error -b jar.txt localhost:8083/api/me/circle/status \
               -o status.json || fail "Reading own circle failed"
          cat status.json; echo
          grep -q '"responderCount":1' status.json || fail "The stored circle did not come back intact"

          if grep -qi "bluebird" response.json created.json status.json register.json login.json; then
            fail "A supplied secret appeared in a response body"
          fi
          echo "OK: refused the passphrase, stored a real circle, echoed no secret"

          # ---- 7. The promise, checked against the SCHEMA itself -------------------
          # Stronger than checking a response: there is nowhere to put a passphrase even if
          # some future handler tried. The only column that may mention it is the DATE one.
          PASSPHRASE_COLUMNS=$(docker exec safeword-db psql -U safeword -d safeword -tAc \
            "SELECT coalesce(string_agg(table_name || '.' || column_name, ','), '') \
             FROM information_schema.columns \
             WHERE table_schema='public' AND column_name LIKE '%passphrase%' \
               AND column_name <> 'passphrase_agreed_on'")
          [ -z "$PASSPHRASE_COLUMNS" ] || fail "The schema has somewhere to store a passphrase: $PASSPHRASE_COLUMNS"
          echo "OK: no column in this database can hold a passphrase"

          echo "--- checking Flyway actually migrated the database ---"
          TABLES=$(docker exec safeword-db psql -U safeword -d safeword -tAc \
            "SELECT string_agg(tablename, ',' ORDER BY tablename) FROM pg_tables WHERE schemaname='public'")
          echo "tables: $TABLES"
          for table in circle_members circles flyway_schema_history login_attempts users spring_session; do
            echo "$TABLES" | grep -q "$table" || fail "Expected table '$table' is missing - Flyway did not run"
          done

          echo "Smoke test passed: the container builds, migrates its database, refuses secrets, keeps strangers out of a family's circle, and still answers the pause screen to anyone."
          docker rm -f safeword safeword-db

# CI for SafeWord.
#
# Runs with no network and no database. The container job is NOT branch-gated, so the
# image is verified before a merge rather than after it - see apps/refillradar/README.md
# for the incident that established that rule.
name: SafeWord CI

on:
  push:
    paths:
      - 'apps/safeword/**'
      - '.github/workflows/safeword-ci.yml'
  pull_request:
    paths:
      - 'apps/safeword/**'
      - '.github/workflows/safeword-ci.yml'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/safeword

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeword-surefire-reports
          path: apps/safeword/target/surefire-reports/
          retention-days: 7

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build          # never build an image from code that failed its tests

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t safeword:${{ github.sha }} apps/safeword

      - name: Smoke test the image
        run: |
          docker run -d --name safeword -p 8083:8083 safeword:${{ github.sha }}

          # Wait for the JVM to bind before curling. Do NOT rely on
          # --retry-connrefused alone: it does not cover curl error 56 (connection
          # reset), which is what Docker's proxy returns while the container is up but
          # the app has not yet bound its port.
          echo "Waiting for application startup..."
          for i in $(seq 1 60); do
            if docker logs safeword 2>&1 | grep -q "Started SafeWordApplication"; then
              echo "Application started after ~${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Application did not start within 60s"
              docker logs safeword
              docker rm -f safeword
              exit 1
            fi
            sleep 1
          done

          # THE security invariant: posting a passphrase must be REFUSED.
          # Note there is no --fail here: the expected response is a 400, which --fail
          # would treat as a transport error and send us down the wrong branch.
          echo "--- POST /api/circles WITH a passphrase: must be refused ---"
          if ! curl --silent --show-error \
                    --retry 10 --retry-delay 2 --retry-all-errors --retry-connrefused \
                    -X POST http://localhost:8083/api/circles \
                    -H 'Content-Type: application/json' \
                    -d '{"name":"ci-smoke-test","passphrase":"bluebird","members":[]}' \
                    -o response.json; then
            echo "::error::Endpoint did not respond. Container logs follow:"
            docker logs safeword
            docker rm -f safeword
            exit 1
          fi

          cat response.json; echo

          # Asserted by a script rather than inline, so it can be run locally - and so a
          # bad edit cannot silently leave the wrong endpoint in place, which is exactly
          # how an earlier version of this step shipped broken.
          if ! python3 apps/safeword/ci/assert_passphrase_refused.py response.json; then
            docker logs safeword
            docker rm -f safeword
            exit 1
          fi

          echo "Smoke test passed: container builds, boots as non-root, and refuses secrets."
          docker rm -f safeword

# CI for BirthPath.
#
# Python rather than Java, but the same principles as the other four workflows: no
# network, no database, deterministic fixtures, and the container job NOT gated on a
# branch so the image is verified before a merge rather than after it.
name: BirthPath CI

on:
  push:
    paths:
      - 'apps/birthpath/**'
      - '.github/workflows/birthpath-ci.yml'
  pull_request:
    paths:
      - 'apps/birthpath/**'
      - '.github/workflows/birthpath-ci.yml'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/birthpath

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/birthpath/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check for known-vulnerable dependencies
        # Advisory only: a new CVE in a transitive dependency should be visible without
        # turning an unrelated pull request red.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build          # never build an image from code that failed its tests

    # Not branch-gated, deliberately - see apps/refillradar/README.md for the incident
    # that established this. Verify everywhere, publish only from main.
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t birthpath:${{ github.sha }} apps/birthpath

      - name: Smoke test the image
        run: |
          docker run -d --name birthpath -p 8084:8084 birthpath:${{ github.sha }}

          # Wait for uvicorn to bind before curling. Do NOT rely on
          # --retry-connrefused alone: it does not cover curl error 56 (connection
          # reset), which is what Docker's proxy returns while the container is up but
          # the app has not yet bound its port. RefillRadar's job failed exactly that way.
          echo "Waiting for application startup..."
          for i in $(seq 1 60); do
            if docker logs birthpath 2>&1 | grep -q "Application startup complete"; then
              echo "Application started after ~${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Application did not start within 60s"
              docker logs birthpath
              docker rm -f birthpath
              exit 1
            fi
            sleep 1
          done

          echo "--- GET /api/facilities: the stale record MUST be downgraded ---"
          if ! curl --fail --silent --show-error \
                    --retry 10 --retry-delay 2 --retry-all-errors --retry-connrefused \
                    "localhost:8084/api/facilities?on=2026-09-20" -o response.json; then
            echo "::error::Endpoint did not respond. Container logs follow:"
            docker logs birthpath
            docker rm -f birthpath
            exit 1
          fi

          cat response.json; echo

          # THE safety invariant, checked against a RUNNING container rather than only
          # in unit tests. The fixture's Big Spring record SAYS it delivers but was last
          # confirmed in January 2025, so it must resolve to "unknown". If that ever
          # stops being downgraded, BirthPath becomes a confident directory of hospitals
          # that may no longer deliver babies.
          if ! python3 apps/birthpath/ci/assert_stale_downgraded.py response.json; then
            echo "::error::SAFETY: a stale facility record was NOT downgraded"
            docker logs birthpath
            docker rm -f birthpath
            exit 1
          fi

          echo "Smoke test passed: container builds, boots as non-root, and stale data is downgraded."
          docker rm -f birthpath

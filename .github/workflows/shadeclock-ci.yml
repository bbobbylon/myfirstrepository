# CI for ShadeClock.
#
# Runs with NO network and NO database: weather comes from a deterministic synthetic
# fixture. Same reasoning as RefillRadar's workflow - a build that depends on a
# third-party API (here api.weather.gov) goes red when someone else has an outage, and
# a CI signal nobody trusts is worse than no CI at all.
name: ShadeClock CI

on:
  push:
    paths:
      - 'apps/shadeclock/**'
      - '.github/workflows/shadeclock-ci.yml'
  pull_request:
    paths:
      - 'apps/shadeclock/**'
      - '.github/workflows/shadeclock-ci.yml'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shadeclock

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B verify

      - name: Upload test reports
        # always() so reports exist when tests FAIL - which is when you need them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-surefire-reports
          path: apps/shadeclock/target/surefire-reports/
          retention-days: 7

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build          # never build an image from code that failed its tests

    # Not gated on a branch, deliberately. PR #1 showed why: a branch-gated container
    # job skips on the pull request, leaving the image unverified until AFTER the merge
    # it was meant to protect. Verify everywhere, publish only from main - it is the
    # registry push that takes a branch gate when one is added.
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t shadeclock:${{ github.sha }} \
            -t shadeclock:latest \
            apps/shadeclock

      - name: Smoke test the image
        run: |
          docker run -d --name shadeclock -p 8081:8081 shadeclock:${{ github.sha }}

          # Wait for the JVM to bind the port before curling it.
          #
          # Do NOT replace this with `curl --retry-connrefused` alone. That flag covers
          # ECONNREFUSED only, and while a container is up but the app has not yet bound
          # its port, Docker's proxy ACCEPTS the connection and then RESETS it - curl
          # error 56, which --retry-connrefused does not retry. RefillRadar's job failed
          # exactly this way; see apps/refillradar/README.md.
          echo "Waiting for application startup..."
          for i in $(seq 1 60); do
            if docker logs shadeclock 2>&1 | grep -q "Started ShadeClockApplication"; then
              echo "Application started after ~${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Application did not start within 60s"
              docker logs shadeclock
              docker rm -f shadeclock
              exit 1
            fi
            sleep 1
          done

          # Exercises the real NWS heat index maths, not just "the process is alive".
          echo "--- GET /api/heat-index?temperatureF=90&humidity=70 ---"
          if ! curl --fail --silent --show-error \
                    --retry 10 --retry-delay 2 --retry-all-errors --retry-connrefused \
                    "localhost:8081/api/heat-index?temperatureF=90&humidity=70" \
                    -o response.json; then
            echo "::error::Endpoint did not respond. Container logs follow:"
            docker logs shadeclock
            docker rm -f shadeclock
            exit 1
          fi

          cat response.json; echo

          # 90°F at 70% RH is 106°F on the published NWS chart. If this drifts, the
          # heat index implementation has changed and every schedule built on it moved.
          if ! grep -q '"heatIndexF":106' response.json; then
            echo "::error::Heat index regression - expected 106F for 90F/70% RH"
            docker logs shadeclock
            docker rm -f shadeclock
            exit 1
          fi

          echo "Smoke test passed: container builds, boots as non-root, and the NWS heat index is correct."
          docker rm -f shadeclock
